name: Update weapon data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Create scraper
        run: |
          cat > scraper.py <<'PY'
          import json
          import re
          import time
          from urllib.parse import quote, urljoin

          import requests
          from bs4 import BeautifulSoup


          BASE = "https://wikiwiki.jp/splatoon3mix/"
          WEAPON_INDEX = BASE + "ブキ"

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 "
                  "(compatible; SplatoonWeaponAnalyzer/1.0)"
          })


          def get(url):

              response = session.get(
                  url,
                  timeout=30
              )

              response.raise_for_status()

              return BeautifulSoup(
                  response.text,
                  "html.parser"
              )


          def clean(text):

              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


          def number(text):

              if not text:
                  return None

              match = re.search(
                  r"-?\d+(?:\.\d+)?",
                  text.replace(",", "")
              )

              if not match:
                  return None

              try:
                  return float(match.group())
              except:
                  return None


          def range_numbers(text):

              if not text:
                  return None, None

              values = re.findall(
                  r"\d+(?:\.\d+)?",
                  text
              )

              if not values:
                  return None, None

              nums = [float(x) for x in values]

              return min(nums), max(nums)


          def find_value(rows, keywords):

              for key, value in rows:

                  if any(
                      keyword in key
                      for keyword in keywords
                  ):
                      return value

              return ""


          def parse_page(url):

              soup = get(url)

              h1 = soup.find("h1")

              if not h1:
                  return None

              name = clean(h1.get_text(" ", strip=True))

              if name.startswith("ブキ/"):
                  return None

              rows = []

              for table in soup.find_all("table"):

                  for tr in table.find_all("tr"):

                      cells = tr.find_all(
                          ["th", "td"]
                      )

                      if len(cells) < 2:
                          continue

                      texts = [
                          clean(
                              cell.get_text(
                                  " ",
                                  strip=True
                              )
                          )
                          for cell in cells
                      ]

                      for i in range(
                          0,
                          len(texts)-1,
                          2
                      ):

                          rows.append(
                              (
                                  texts[i],
                                  texts[i+1]
                              )
                          )


              effective = number(
                  find_value(
                      rows,
                      ["有効射程"]
                  )
              )

              maintain = number(
                  find_value(
                      rows,
                      ["確定数維持射程"]
                  )
              )

              reticle = number(
                  find_value(
                      rows,
                      ["レティクル反応距離"]
                  )
              )

              paint = number(
                  find_value(
                      rows,
                      ["塗り射程"]
                  )
              )

              damage_text = find_value(
                  rows,
                  ["ダメージ"]
              )

              damage_values = re.findall(
                  r"\d+(?:\.\d+)?",
                  damage_text
              )

              damage_nums = [
                  float(x)
                  for x in damage_values
              ]

              damage_max = (
                  max(damage_nums)
                  if damage_nums
                  else None
              )

              damage_min = (
                  min(damage_nums)
                  if damage_nums
                  else None
              )

              fire_rate = number(
                  find_value(
                      rows,
                      ["連射フレーム"]
                  )
              )

              dps = number(
                  find_value(
                      rows,
                      ["DPS"]
                  )
              )

              kill_time = number(
                  find_value(
                      rows,
                      ["キルタイム"]
                  )
              )

              shots = number(
                  find_value(
                      rows,
                      ["秒間発射数"]
                  )
              )

              fire_duration = number(
                  find_value(
                      rows,
                      ["射撃継続時間"]
                  )
              )

              human_speed = number(
                  find_value(
                      rows,
                      ["射撃時ヒト速",
                       "射撃中ヒト速"]
                  )
              )

              swim_speed = number(
                  find_value(
                      rows,
                      ["イカ速"]
                  )
              )

              paint_points = number(
                  find_value(
                      rows,
                      ["単発塗りポイント",
                       "1トリガー分の塗りポイント"]
                  )
              )

              blast_radius = number(
                  find_value(
                      rows,
                      ["爆風半径"]
                  )
              )

              direct_damage = number(
                  find_value(
                      rows,
                      ["ダメージ（直撃）"]
                  )
              )

              blast_damage = number(
                  find_value(
                      rows,
                      ["ダメージ（爆風）"]
                  )
              )

              blast_range = number(
                  find_value(
                      rows,
                      ["ダメージ射程（爆風）"]
                  )
              )

              damage_start = None
              damage_end = None

              damage_row = find_value(
                  rows,
                  ["ダメージ"]
              )

              frame_match = re.search(
                  r"\((\d+)F[～~](\d+)F\)",
                  damage_row
              )

              if frame_match:

                  damage_start = int(
                      frame_match.group(1)
                  )

                  damage_end = int(
                      frame_match.group(2)
                  )


              category = detect_category(
                  name
              )

              if not category:
                  return None

              image = ""

              for img in soup.find_all("img"):

                  alt = clean(
                      img.get("alt","")
                  )

                  src = (
                      img.get("src")
                      or img.get("data-src")
                      or ""
                  )

                  if (
                      name in alt
                      and src
                  ):

                      image = urljoin(
                          url,
                          src
                      )

                      break


              return {
                  "id": quote(
                      name,
                      safe=""
                  ),
                  "name": name,
                  "english": "",
                  "category": category,
                  "image": image,
                  "wikiUrl": url,

                  "effectiveRange": effective,
                  "maintainRange": maintain,
                  "reticleRange": reticle,
                  "paintRange": paint,

                  "damageMax": damage_max,
                  "damageMin": damage_min,

                  "damageStartFrame":
                      damage_start,

                  "damageEndFrame":
                      damage_end,

                  "kills":
                      find_value(
                          rows,
                          ["確定数"]
                      ),

                  "fireRate": fire_rate,
                  "shotsPerSecond": shots,
                  "killTime": kill_time,
                  "dps": dps,

                  "fireDuration":
                      fire_duration,

                  "humanSpeed":
                      human_speed,

                  "swimSpeed":
                      swim_speed,

                  "paintPoints":
                      paint_points,

                  "blastRange":
                      blast_range,

                  "blastRadius":
                      blast_radius,

                  "directDamage":
                      direct_damage,

                  "blastDamage":
                      blast_damage
              }


          def detect_category(name):

              categories = {
                  "ブラスター":
                      "ブラスター",
                  "ローラー":
                      "ローラー",
                  "フデ":
                      "フデ",
                  "チャージャー":
                      "チャージャー",
                  "スロッシャー":
                      "スロッシャー",
                  "スピナー":
                      "スピナー",
                  "マニューバー":
                      "マニューバー",
                  "シェルター":
                      "シェルター",
                  "ストリンガー":
                      "ストリンガー",
                  "ワイパー":
                      "ワイパー"
              }

              for keyword, category in categories.items():

                  if keyword in name:
                      return category

              shooter_names = [
                  "シューター",
                  "N-ZAP",
                  "ボールドマーカー",
                  "プロモデラー",
                  "プライムシューター",
                  "ジェットスイーパー",
                  "デュアルスイーパー",
                  "H3リールガン",
                  "L3リールガン",
                  "ボトルガイザー"
              ]

              if any(
                  keyword in name
                  for keyword in shooter_names
              ):
                  return "シューター"

              return None


          def main():

              soup = get(WEAPON_INDEX)

              links = {}

              for a in soup.find_all("a"):

                  href = a.get("href","")

                  text = clean(
                      a.get_text(
                          " ",
                          strip=True
                      )
                  )

                  if not href or not text:
                      continue

                  full = urljoin(
                      WEAPON_INDEX,
                      href
                  )

                  if "/ブキ/" not in full:
                      continue

                  if (
                      "属" in text
                      or "比較" in text
                      or "性能" in text
                  ):
                      continue

                  links[text] = full


              weapons = []

              print(
                  f"Found {len(links)} candidate pages"
              )

              for i,(name,url) in enumerate(
                  links.items(),
                  start=1
              ):

                  try:

                      print(
                          f"[{i}/{len(links)}] {name}"
                      )

                      data = parse_page(url)

                      if data:
                          weapons.append(data)

                  except Exception as e:

                      print(
                          "ERROR:",
                          name,
                          e
                      )

                  time.sleep(.15)


              weapons.sort(
                  key=lambda x: x["name"]
              )

              result = {
                  "updated":
                      time.strftime(
                          "%Y-%m-%d %H:%M:%S UTC",
                          time.gmtime()
                      ),

                  "source":
                      BASE,

                  "count":
                      len(weapons),

                  "weapons":
                      weapons
              }

              with open(
                  "data/weapons.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      result,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


              print(
                  f"Saved {len(weapons)} weapons"
              )


          if __name__ == "__main__":
              main()

          PY

      - name: Update data
        run: |
          mkdir -p data
          python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/weapons.json

          git diff --cached --quiet || \
            git commit -m "Update weapon data"

          git push
